<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda · Intendente</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0a0e17;
    --bg2:      #0f1420;
    --bg3:      #151d2d;
    --border:   rgba(255,255,255,0.08);
    --border2:  rgba(255,255,255,0.12);
    --accent:   #00d9ff;
    --accent-dark: #0099cc;
    --text:     #f0f2f5;
    --text-secondary: #a8adb5;
    --danger:   #ff6b6b;
    --success:  #51cf66;
  }

  *, *::before, *::after { 
    margin: 0; 
    padding: 0; 
    box-sizing: border-box; 
  }

  html { 
    scroll-behavior: smooth; 
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, var(--bg) 0%, var(--bg2) 50%, var(--bg3) 100%);
    background-attachment: fixed;
    color: var(--text);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 20% 50%, rgba(0, 217, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 153, 204, 0.03) 0%, transparent 50%);
    pointer-events: none;
    z-index: -1;
  }

  /* ─── HEADER ─── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(10, 14, 23, 0.85);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
    padding: 24px 0;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
  }

  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
  }

  .brand {
    flex: 1;
  }

  .brand-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    line-height: 1.2;
  }

  .brand-sub {
    font-size: 0.75rem;
    font-weight: 400;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-top: 6px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .status-indicator {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-secondary);
    flex-shrink: 0;
    transition: background 0.4s, box-shadow 0.4s;
    animation: pulse 2s infinite;
  }

  #status-dot.ok {
    background: var(--success);
    box-shadow: 0 0 12px var(--success);
    animation: pulse-ok 2s infinite;
  }

  #status-dot.err {
    background: var(--danger);
    box-shadow: 0 0 12px var(--danger);
    animation: pulse-err 1s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  @keyframes pulse-ok {
    0%, 100% { box-shadow: 0 0 12px var(--success), 0 0 24px rgba(81, 207, 102, 0.3); }
    50% { box-shadow: 0 0 6px var(--success); }
  }

  @keyframes pulse-err {
    0%, 100% { box-shadow: 0 0 12px var(--danger); }
    50% { box-shadow: 0 0 6px var(--danger); }
  }

  #status-text {
    font-size: 0.75rem;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    text-transform: uppercase;
  }

  .btn-refresh {
    background: rgba(0, 217, 255, 0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Poppins', sans-serif;
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.08em;
    padding: 8px 16px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    text-transform: uppercase;
  }

  .btn-refresh:hover {
    background: var(--accent);
    color: var(--bg);
    box-shadow: 0 0 20px rgba(0, 217, 255, 0.4);
    transform: translateY(-2px);
  }

  /* ─── MAIN ─── */
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 48px 24px 80px;
  }

  .state-msg {
    text-align: center;
    padding: 100px 24px;
    color: var(--text-secondary);
  }

  .state-msg .icon {
    font-size: 3rem;
    margin-bottom: 20px;
    opacity: 0.6;
  }

  .state-msg p {
    font-size: 0.95rem;
    line-height: 1.8;
    margin-bottom: 16px;
  }

  .state-msg a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
    transition: color 0.3s;
  }

  .state-msg a:hover {
    color: var(--accent-dark);
  }

  .state-msg code {
    font-size: 0.8rem;
    background: var(--bg3);
    padding: 4px 10px;
    border-radius: 6px;
    color: var(--accent);
    font-family: 'Courier New', monospace;
  }

  /* ─── COUNT BAR ─── */
  .count-bar {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin-bottom: 40px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .count-bar::before {
    content: '';
    width: 24px;
    height: 2px;
    background: linear-gradient(to right, var(--accent), transparent);
    border-radius: 1px;
  }

  /* ─── DAY BLOCK ─── */
  .day-block {
    margin-bottom: 48px;
    animation: fadeInUp 0.5s ease both;
  }

  @keyframes fadeInUp {
    from {
      opacity: 0;
      transform: translateY(20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .day-heading {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 2px solid var(--border);
  }

  .day-name {
    font-family: 'Poppins', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    min-width: 70px;
  }

  .day-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .day-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, var(--border), transparent);
  }

  /* ─── CARD ─── */
  .card {
    background: linear-gradient(135deg, rgba(21, 29, 45, 0.6) 0%, rgba(15, 20, 32, 0.4) 100%);
    border: 1px solid var(--border2);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transition: all 0.3s cubic-bezier(0.23, 1, 0.320, 1);
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(10px);
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--accent), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }

  .card:hover {
    border-color: var(--accent);
    background: linear-gradient(135deg, rgba(21, 29, 45, 0.8) 0%, rgba(15, 20, 32, 0.6) 100%);
    box-shadow: 0 8px 32px rgba(0, 217, 255, 0.15), inset 0 1px 0 rgba(0, 217, 255, 0.1);
    transform: translateY(-4px);
  }

  .card:hover::before {
    opacity: 1;
  }

  /* ─── CARD HORA ─── */
  .card-hora-section {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .card-hora-icon {
    font-size: 1.4rem;
    opacity: 0.8;
  }

  .card-hora-num {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 700;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -0.02em;
  }

  .card-hora-label {
    font-family: 'Poppins', sans-serif;
    font-size: 0.65rem;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-secondary);
  }

  /* ─── CARD BODY ─── */
  .card-body {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .card-motivo {
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.5;
    letter-spacing: -0.01em;
  }

  .card-lugar {
    font-size: 0.85rem;
    font-weight: 500;
    color: var(--text-secondary);
    display: flex;
    align-items: flex-start;
    gap: 10px;
  }

  .card-lugar::before {
    content: '📍';
    font-size: 0.9rem;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .card-horarios-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 12px 0;
  }

  .card-horario-item {
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    background: rgba(0, 217, 255, 0.08);
    border-radius: 8px;
    border-left: 3px solid var(--accent);
  }

  .card-horario-item::before {
    content: '🕐';
    font-size: 0.85rem;
  }

  /* ─── MULTI-HORA CARD ─── */
  .card.multi-hora {
    display: flex;
    flex-direction: column;
  }

  .card.multi-hora .card-hora-section {
    flex-direction: row;
    align-items: center;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
  }

  /* ─── FOOTER ─── */
  footer {
    max-width: 900px;
    margin: 0 auto;
    padding: 24px;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 768px) {
    .header-inner {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    .header-right {
      width: 100%;
      justify-content: space-between;
    }

    .brand-title {
      font-size: 1.5rem;
    }

    main {
      padding: 32px 16px 60px;
    }

    .day-heading {
      flex-wrap: wrap;
    }

    .card {
      padding: 20px;
    }

    .card-motivo {
      font-size: 1rem;
    }

    .card-hora-num {
      font-size: 1.4rem;
    }
  }

  @media (max-width: 480px) {
    .header-inner {
      padding: 0 16px;
    }

    .brand-title {
      font-size: 1.3rem;
    }

    .brand-sub {
      font-size: 0.65rem;
    }

    main {
      padding: 24px 12px 50px;
    }

    .card {
      padding: 16px;
      gap: 12px;
    }

    .card-motivo {
      font-size: 0.95rem;
    }

    .card-hora-num {
      font-size: 1.2rem;
    }

    .day-heading {
      gap: 8px;
    }

    .day-num {
      font-size: 1.1rem;
    }

    footer {
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
  }

  @media print {
    body {
      background: white;
      color: black;
    }

    header, footer, .btn-refresh {
      display: none !important;
    }

    .card {
      background: white;
      border: 1px solid #ddd;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .card-motivo {
      color: black;
    }

    .card-hora-num, .card-horario-item {
      color: #0099cc;
    }

    .day-name {
      color: #0099cc;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-title">Agenda del Intendente</div>
      <div class="brand-sub">Municipalidad de Caá Catí</div>
    </div>
    <div class="header-right">
      <div class="status-indicator">
        <div id="status-dot"></div>
        <span id="status-text">—</span>
      </div>
      <button class="btn-refresh" onclick="loadData()">↻ Actualizar</button>
    </div>
  </div>
</header>

<main>
  <div id="app"></div>
</main>

<footer>
  <span>Agenda Oficial · Municipalidad de Caá Catí</span>
  <span id="last-update">Sin datos</span>
</footer>

<script>
// ─── CONFIGURACIÓN ───────────────────────────────────────────────
const SHEET_ID = '1HOqEYf9-CQRpV5I12LCleKriYFQ0CaLBVL7w_QwTcTI';
const SHEET_GID = '0';
// ─────────────────────────────────────────────────────────────────

const DIAS   = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
const MESES  = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function parseFecha(str) {
  str = str.trim();
  if (!str) return null;
  if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(str)) {
    const [d, m, y] = str.split('/').map(Number);
    return new Date(y, m - 1, d);
  }
  if (/^\d{4}-\d{2}-\d{2}$/.test(str)) {
    const [y, m, d] = str.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  if (/^\d{4,6}$/.test(str)) {
    const base = new Date(1899, 11, 30);
    base.setDate(base.getDate() + Number(str));
    return base;
  }
  const t = new Date(str);
  return isNaN(t) ? null : t;
}

function fechaKey(dt) {
  return dt.getFullYear() + '-' + String(dt.getMonth()+1).padStart(2,'0') + '-' + String(dt.getDate()).padStart(2,'0');
}

function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function parseCSV(text) {
  const lines = text.trim().split(/\r?\n/);
  if (lines.length < 2) return [];
  const headers = splitCSVLine(lines[0]).map(h => h.toLowerCase().trim());
  const idxFecha  = headers.findIndex(h => h.includes('fecha'));
  const idxHora   = headers.findIndex(h => h.includes('hora'));
  const idxLugar  = headers.findIndex(h => h.includes('lugar'));
  const idxMotivo = headers.findIndex(h => h.includes('motivo') || h.includes('descripci'));
  const rows = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = splitCSVLine(lines[i]);
    if (cols.every(c => !c.trim())) continue;
    rows.push({
      fecha:  idxFecha  >= 0 ? cols[idxFecha]  || '' : '',
      hora:   idxHora   >= 0 ? cols[idxHora]   || '' : '',
      lugar:  idxLugar  >= 0 ? cols[idxLugar]  || '' : '',
      motivo: idxMotivo >= 0 ? cols[idxMotivo] || '' : '',
    });
  }
  return rows;
}

function splitCSVLine(line) {
  const result = []; let cur = '', inQ = false;
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (inQ) {
      if (c === '"') {
        if (line[i + 1] === '"') { cur += '"'; i++; } // comilla escapada ("") dentro de campo entre comillas
        else { inQ = false; } // cierre real del campo
      } else {
        cur += c;
      }
      continue;
    }
    if (c === '"') { inQ = true; continue; }
    if (c === ',') { result.push(cur); cur = ''; continue; }
    cur += c;
  }
  result.push(cur);
  return result;
}

function csvUrl(id) {
  return 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv&gid=' + SHEET_GID;
}

async function loadData() {
  if (!SHEET_ID || SHEET_ID === 'TU_SHEET_ID_ACÁ') {
    document.getElementById('app').innerHTML = `
      <div class="state-msg">
        <div class="icon">⚙️</div>
        <p>Falta configurar el Sheet ID.<br>
        Abrí el archivo <code>agenda-intendente.html</code>, buscá la línea<br>
        <code>const SHEET_ID = 'TU_SHEET_ID_ACÁ';</code><br>
        y reemplazá el texto por el ID real de tu Google Sheet.</p>
      </div>`;
    return;
  }
  setStatus('loading');
  try {
    const res = await fetch(csvUrl(SHEET_ID), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    setStatus('ok', 'Conectado');
    renderAgenda(rows);
    document.getElementById('last-update').textContent =
      'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit', hour12: false });
  } catch(e) {
    setStatus('err', 'Error al cargar');
    renderError(e);
  }
}

function setStatus(state, msg) {
  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  dot.className = '';
  if (state === 'loading') { dot.style.background = 'var(--text-secondary)'; txt.textContent = 'Cargando…'; }
  if (state === 'ok')  { dot.classList.add('ok');  txt.textContent = msg || 'Conectado'; }
  if (state === 'err') { dot.classList.add('err'); txt.textContent = msg || 'Error'; }
}

function renderAgenda(rows) {
  const app = document.getElementById('app');
  const valid = rows.filter(r => r.fecha.trim());
  const parsed = valid.map(r => ({ ...r, dt: parseFecha(r.fecha) }))
    .filter(r => r.dt)
    .sort((a,b) => { const d = a.dt - b.dt; return d !== 0 ? d : (a.hora||'').localeCompare(b.hora||''); });

  if (parsed.length === 0) {
    app.innerHTML = '<div class="state-msg"><div class="icon">📭</div><p>No hay reuniones cargadas en el Sheet.<br>La secretaria puede agregar filas con Fecha, Hora, Lugar y Motivo.</p></div>';
    return;
  }

  const byDay = new Map();
  for (const r of parsed) {
    const k = fechaKey(r.dt);
    if (!byDay.has(k)) byDay.set(k, { dt: r.dt, items: [] });
    byDay.get(k).items.push(r);
  }

  let html = '<div class="count-bar">' + parsed.length + (parsed.length === 1 ? ' reunión' : ' reuniones') + '</div>';
  let delay = 0;
  for (const [, { dt, items }] of byDay) {
    html += '<div class="day-block" style="animation-delay:' + delay + 'ms">';
    html += '<div class="day-heading"><span class="day-name">' + DIAS[dt.getDay()] + '</span><span class="day-num">' + dt.getDate() + ' de ' + MESES[dt.getMonth()] + '</span><span class="day-line"></span></div>';
    for (const r of items) {
      const horaText = (r.hora || '').trim();
      const isMulti = /[\n\r,;]/.test(horaText);
      
      if (isMulti) {
        // Normalizar múltiples horarios
        const horarios = horaText.split(/[,;\n\r]+/).map(h => h.trim()).filter(h => h);
        let horariosHtml = '<div class="card-horarios-list">';
        for (const h of horarios) {
          horariosHtml += '<div class="card-horario-item">' + esc(h) + '</div>';
        }
        horariosHtml += '</div>';
        
        html += '<div class="card multi-hora">'
          + '<div class="card-body">'
          + '<div class="card-motivo">' + esc(r.motivo) + '</div>'
          + horariosHtml
          + (r.lugar ? '<div class="card-lugar">' + esc(r.lugar) + '</div>' : '')
          + '</div></div>';
      } else {
        html += '<div class="card">'
          + '<div class="card-body">'
          + '<div class="card-motivo">' + esc(r.motivo) + '</div>'
          + '<div class="card-hora-section"><span class="card-hora-icon">🕐</span><div><div class="card-hora-num">' + esc(r.hora) + '</div><div class="card-hora-label">hs</div></div></div>'
          + (r.lugar ? '<div class="card-lugar">' + esc(r.lugar) + '</div>' : '')
          + '</div></div>';
      }
    }
    html += '</div>';
    delay += 80;
  }
  app.innerHTML = html;
}

function renderError(e) {
  document.getElementById('app').innerHTML = '<div class="state-msg"><div class="icon">⚠️</div><p>No se pudo cargar el Sheet.<br>Verificá que esté <strong>compartido públicamente</strong> y que el ID sea correcto.<br><br><small>' + esc(e.message) + '</small></p></div>';
}

loadData();
setInterval(loadData, 5 * 60 * 1000);
</script>
</body>
</html>
